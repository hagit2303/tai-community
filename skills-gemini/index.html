<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>סקילים בג׳מיני · קהילת TAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FA;--ink:#13233A;--mut:#5E6E82;--rich:#D7263D;--poor:#2457C5;--card:#fff;--line:#DCE3EA}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
.sw{display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.sw a{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:600}
.sw a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.eb{font-size:14px;font-weight:800;color:var(--rich);letter-spacing:.02em}
h1{font-size:clamp(40px,7vw,76px);font-weight:800;line-height:1.05;margin:6px 0 10px}
h1 span{color:var(--poor)}
.lead{font-size:clamp(18px,2.2vw,23px);color:var(--mut);max-width:40ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(18px,4vw,48px);align-items:center;margin-bottom:44px}
a.back{display:inline-block;margin-bottom:18px;color:var(--poor);font-weight:700;text-decoration:none}
.yt{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt.soon{display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--mut);font-weight:700;border:2px dashed var(--line)}
video{width:100%;border-radius:14px;border:1px solid var(--line);background:#000;display:block}
h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;margin:0 0 16px}
.steps{list-style:none;display:grid;gap:12px;margin-bottom:46px;counter-reset:s}
.steps li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.steps .n{grid-row:span 3;font-size:44px;font-weight:800;line-height:1;color:var(--poor);min-width:38px;text-align:center}
.steps li:first-child .n{color:var(--rich)}
.steps b{font-size:21px}
.warn{color:var(--rich);font-weight:800}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:40px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.sk .tag{font-size:14px;font-weight:800}
.sk:nth-child(1) .tag{color:var(--rich)}.sk:nth-child(2) .tag{color:var(--poor)}
.sk.gift .tag{align-self:flex-start;background:var(--poor);color:#fff;font-size:18px;padding:5px 14px;border-radius:999px}
.sk h3{font-size:28px;font-weight:800;line-height:1.15}
.slug{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--mut);direction:ltr;text-align:right}
.try{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.note{font-size:15px;color:var(--mut)}
.add{align-self:flex-start;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;padding:10px 18px;border-radius:999px}
.sk:nth-child(1) .add{background:var(--rich)}.sk:nth-child(2) .add{background:var(--poor)}
.todo{align-self:flex-start;border:2px dashed var(--rich);color:var(--rich);font-weight:800;padding:8px 14px;border-radius:999px}
.sig{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:22px;font-size:20px}
.sig img{height:64px;width:auto;border-radius:8px}
.sig b{font-weight:800}
@media(max-width:760px){.hero,.duo{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><a class="back" href="../">→ חזרה לאתר קהילת TAI</a><div id="app"></div></div>
<script>window.FORCE="tai"</script><script src="content.js"></script>
<script>
function vid(u){var m=u&&u.match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/);if(m)return '<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/'+m[1]+'" title="סרטון: סקילים בג׳מיני" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';if(u)return '<video src="'+u+'" controls playsinline preload="metadata"></video>';return '<div class="yt soon">🎬 הסרטון יעלה כאן בקרוב</div>';}
var G=GUIDE,c=pickCommunity(),C=G.communities[c];
var h=window.FORCE?'':'<nav class="sw">'+Object.keys(G.communities).map(function(k){var x=G.communities[k];return '<a href="?c='+k+'" class="'+(k===c?'on':'')+'">'+x.emoji+' '+x.label+'</a>'}).join('')+'</nav>';
if(window.FORCE)h='';
h+='<section class="hero"><div><div class="eb">'+C.emoji+' '+C.label+' · טיפ</div><h1>'+G.title+'<br><span>'+G.sub+'</span></h1><p class="lead">'+G.intro+'</p></div>'+vid(G.video)+'</section>';
h+='<h2>ארבעה צעדים</h2><ol class="steps">'+G.steps.map(function(s,i){return '<li><span class="n">'+(i+1)+'</span><b>'+s.t+'</b><span>'+s.d+'</span>'+(s.warn?'<span class="warn">'+s.warn+'</span>':'')+'</li>'}).join('')+'</ol>';
h+='<h2>'+C.hello+'</h2><div class="duo">'+C.skills.map(function(s){return '<article class="sk'+(s.gift?' gift':'')+'"><span class="tag">'+(s.gift?'🎁 מתנה':'הסקיל של היום')+'</span><h3>'+s.name+'</h3><div class="slug">@'+s.slug+'</div><p>'+s.what+'</p><div class="try"><b>לנסות:</b> '+s.tryit+'</div><p class="note">'+s.note+'</p>'+linkOrTodo(s)+'</article>'}).join('')+'</div>';
h+='<footer class="sig">'+(C.logo?'<img src="'+C.logo+'" alt="לוגו '+C.label+'">':'')+'<div>בבינה רבה,<br><b>'+C.sign+'</b></div></footer>';
document.getElementById('app').innerHTML=h;
</script></body></html>
